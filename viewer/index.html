<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFT3 URDF Viewer</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2c313a; --text: #e6e8ec;
    --muted: #8b93a1; --accent: #4da3ff; --warn: #f0b343;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", "Microsoft YaHei", "Yu Gothic", sans-serif; }
  #app { display: flex; height: 100%; }
  #panel { width: 340px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 14px 14px 30px; }
  #view { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  select { background: #262b34; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
  .sub { color: var(--muted); margin-bottom: 10px; }
  #status { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; }
  #status.warn { border-color: var(--warn); color: var(--warn); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  button { background: #262b34; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #06121f; border-color: var(--accent); }
  label.chk { display: inline-flex; align-items: center; gap: 5px; margin-right: 10px; color: var(--muted); }
  details { border-top: 1px solid var(--line); padding: 8px 0 2px; }
  summary { cursor: pointer; font-weight: 600; margin-bottom: 6px; }
  .row { display: grid; grid-template-columns: 104px 1fr 62px; align-items: center; gap: 6px; margin: 3px 0; }
  .row { border-radius: 4px; padding: 0 4px; margin-left: -4px; margin-right: -4px; cursor: pointer; }
  .row.hot { background: rgba(77,163,255,.12); }
  .row.sel { background: rgba(255,167,51,.18); outline: 1px solid #ffa733; }
  .row.sel .name { color: #ffa733; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #hud { position: absolute; left: 12px; bottom: 12px; background: rgba(20,22,26,.8); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre; pointer-events: none; }
  #help { position: absolute; right: 12px; top: 12px; color: var(--muted); text-align: right; pointer-events: none; }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; background: #262b34; color: var(--text); }
  @media (max-width: 760px) { #app { flex-direction: column-reverse; } #panel { width: 100%; height: 45%; border-right: 0; border-top: 1px solid var(--line); } #help { display: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }
</script>
</head>
<body>
<div id="app">
  <div id="panel">
    <div class="head"><h1>LIFT3</h1>
      <select id="lang" aria-label="Language">
        <option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option><option value="ru">Русский</option>
      </select></div>
    <div class="sub" data-i18n="subtitle"></div>
    <div id="status"></div>
    <div class="btns">
      <button id="bReset" data-i18n="reset"></button>
      <button id="bRandom" data-i18n="random"></button>
      <button id="bAnim" data-i18n="anim"></button>
    </div>
    <div style="margin-bottom:8px">
      <label class="chk"><input type="checkbox" id="cFrames" checked> <span data-i18n="frames"></span></label>
      <label class="chk"><input type="checkbox" id="cAxes"> <span data-i18n="axes"></span></label>
      <label class="chk"><input type="checkbox" id="cCouple" checked> <span data-i18n="couple"></span></label>
      <label class="chk"><input type="checkbox" id="cHiQ" checked> <span data-i18n="hiq"></span></label>
    </div>
    <div id="groups"></div>
  </div>
  <div id="view">
    <div id="help"></div>
    <div id="hud"></div>
  </div>
</div>

function linkCapsule(a, b, r, mat) {
  const g = new THREE.Group();
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  if (len > 1e-6) {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 20), mat);
    c.position.copy(a).addScaledVector(d, 0.5);
    c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
    g.add(c);
  }
  for (const p of [a, b]) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 12), mat);
    s.position.copy(p);
    g.add(s);
  }
  return g;
}

// Placeholder geometry built only from URDF numbers (joint origins, masses, inertias).
function buildPlaceholder(L) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: L.color, roughness: 0.6, metalness: 0.1 });
  const I = L.inertia, m = L.mass;
  const pj = L.parentJoint;
  if (pj && pj.type === 'continuous') {
    // wheel: solid cylinder about the joint axis, size from inertia
    const Ia = I[0] * pj.axis.x ** 2 + I[1] * pj.axis.y ** 2 + I[2] * pj.axis.z ** 2;
    const r = Math.sqrt(2 * Ia / m);
    const It = (I[0] + I[1] + I[2] - Ia) / 2;
    const w = Math.sqrt(Math.max(12 * (It / m - r * r / 4), 1e-4));
    const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, w, 32), mat);
    c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pj.axis);
    c.position.copy(L.com);
    g.add(c);
    const mark = new THREE.Mesh(new THREE.BoxGeometry(w * 1.04, r * 1.7, 0.012),
      new THREE.MeshStandardMaterial({ color: 0x8b93a1 }));   // spoke, so spin is visible
    mark.position.copy(L.com);
    g.add(mark);
    L.wheelRadius = r;
  } else if (m > 3) {
    // heavy body: box with the same mass and principal inertia
    const dim = k => Math.sqrt(Math.max(6 * (I[0] + I[1] + I[2] - 2 * I[k]) / m, 1e-4));
    const b = new THREE.Mesh(new THREE.BoxGeometry(dim(0), dim(1), dim(2)), mat);
    b.position.copy(L.com);
    g.add(b);
  } else if (L.childJoints.length === 0 && pj && pj.type === 'prismatic') {
    // gripper finger
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.012, 0.026), mat);
    b.position.set(0.035, 0, 0);
    g.add(b);
  } else {
    // arm link: capsules from link origin to each child joint
    const r = THREE.MathUtils.clamp(0.03 * Math.sqrt(m), 0.014, 0.03);
    const o = new THREE.Vector3();
    for (const cj of L.childJoints.filter(j => j.type !== 'prismatic'))
      g.add(linkCapsule(o, cj.origin.position, r, mat));
    if (L.childJoints.some(j => j.type === 'prismatic')) {
      // gripper palm
      const x = L.childJoints[0].origin.position.x;
      const b = new THREE.Mesh(new THREE.BoxGeometry(x, 0.11, 0.04), mat);
      b.position.set(x / 2, 0, 0);
      g.add(b);
    }
  }
  return g;
}

async function loadVisuals(L, linkEl, materials) {
  const placeholder = buildPlaceholder(L);

  const visuals = children(linkEl, 'visual');
  const results = await Promise.all(visuals.map(async v => {
    const meshEl = child(child(v, 'geometry'), 'mesh');
    if (!meshEl) return null;
    meshTotal++;
    try {
      const res = await fetch(resolveMesh(meshEl.getAttribute('filename')));
      if (!res.ok) throw new Error(res.status);
      const geo = stl.parse(await res.arrayBuffer());
      geo.computeVertexNormals();
      const mname = child(v, 'material')?.getAttribute('name');
      const look = { lift_white: { roughness: 0.35, metalness: 0.0, clearcoat: 0.6, clearcoatRoughness: 0.25 },
        lift_black: { roughness: 0.42, metalness: 0.25, clearcoat: 0.3, clearcoatRoughness: 0.4 },
        lift_silver: { roughness: 0.28, metalness: 0.9 },
        lift_rubber: { roughness: 0.9, metalness: 0.0 } }[mname] ?? { roughness: 0.5, metalness: 0.2 };
      const mesh = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color: materials[mname] ?? 0xb0b0b0, ...look }));
      mesh.castShadow = mesh.receiveShadow = true;
      const s = nums(meshEl.getAttribute('scale'), [1, 1, 1]);
      mesh.scale.set(...s);
      const holder = new THREE.Group();
      applyOrigin(holder, child(v, 'origin'));
      holder.add(mesh);
      meshOk++;
      return holder;
    } catch { return null; }
  }));
  const ok = results.filter(Boolean);
  if (ok.length === visuals.length && ok.length) {
    L.group.remove(placeholder);
    ok.forEach(h => L.group.add(h));
  }
  L.group.traverse(o => { if (o.isMesh) { o.userData.link = L; (L.meshes ??= []).push(o); } });
}

function setJoint(name, v, fromUI) {

// ---------- omni-wheel chassis dynamics ----------
// The chassis has no x/y/yaw actuators. Each wheel i has a velocity command; a velocity
// loop turns the error into motor torque (clamped to the URDF effort limit). Torque / radius
// is the traction force along the wheel's rolling direction t_i; rollers slide freely along
// the axle. With no slip, wheel speed and body twist v = (vx, vy, wz) are tied by
//     w_i = -(t_i . (v_lin + wz z x p_i)) / r = -(row_i . v) / r

    const Q = [mp.m * v[2] * v[1], -mp.m * v[2] * v[0], 0];
    wheels.forEach((w, i) => {
      const wi = -(w.row[0] * v[0] + w.row[1] * v[1] + w.row[2] * v[2]) / w.r;
      const tau = THREE.MathUtils.clamp(KP_WHEEL * (drive.cmd[i] - wi), -w.J.effort, w.J.effort);

}

    r.pos_err_mm[1], r.rot_err_deg[1], (r.peak_torque_ratio * 100).toFixed(0));

  selectTarget(null);

}

// ---------- live policy (rl/live_server.py): the server simulates, this page shows and sends targets ----------
const live = { on: false, ok: false, busy: false, last: 0, sent: '', sentAt: 0, st: null, ui: {} };
const targetPayload = () => ({ targets: targets.map(T => ({ p: T.group.position.toArray(), q: T.group.quaternion.toArray() })) });
const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {}) }).catch(() => null);
function showLive() {
  const u = live.ui; if (!u.info) return;
  u.start.textContent = tr(live.on ? 'live_stop' : 'live_start');
  u.start.classList.toggle('on', live.on);
  u.start.disabled = u.reset.disabled = !live.ok;
  const s = live.st;
  if (!live.ok) u.info.textContent = tr('live_off');
  else if (!live.on || !s?.ready) u.info.textContent = tr('live_hint');
  else u.info.textContent = tr('live_info', s.iter, s.pos_err_mm[0], s.rot_err_deg[0], s.pos_err_mm[1], s.rot_err_deg[1],
    (Math.max(...s.torque_ratio) * 100).toFixed(0), (s.peak * 100).toFixed(0), s.contact ? tr('live_contact') : '');
}
rerender.push(showLive);
async function buildLiveUI() {
  const g = addGroup('g_live');
  document.getElementById('groups').prepend(g);
  const r = document.createElement('div'); r.className = 'btns';
  live.ui.start = document.createElement('button');
  live.ui.start.onclick = () => {
    live.on = !live.on;
    if (live.on) { stopAnim(); play.on = false; play.k = -1; live.sent = ''; post('/api/lock', { lock }); }
    showLive();
  };
  live.ui.reset = setText(document.createElement('button'), 'live_reset');
  live.ui.reset.onclick = () => { resetTargets(); selectTarget(null); post('/api/reset'); };
  live.ui.info = document.createElement('div'); live.ui.info.className = 'sub'; live.ui.info.style.marginTop = '6px';
  r.append(live.ui.start, live.ui.reset);
  const rl = document.createElement('div'); rl.className = 'btns';
  ['lock_l', 'lock_r'].forEach((key, i) => {
    const b = setText(document.createElement('button'), key);
    b.onclick = () => setLock(i, !lock[i]);
    lockUI[i] = b; rl.append(b);
  });
  const lh = setText(document.createElement('div'), 'lock_hint'); lh.className = 'sub';
  g.append(r, live.ui.info, rl, lh);
  const res = await fetch('/api/state', { cache: 'no-store' }).catch(() => null);
  live.ok = !!res?.ok && (res.headers.get('content-type') || '').includes('json');
  showLive();
  showFeasible();
}
async function liveTick(now) {
  if (live.busy || now - live.last < 30) return;
  live.busy = true; live.last = now;
  try {
    const body = JSON.stringify(targetPayload());
    if (body !== live.sent && now - live.sentAt > 80) { live.sent = body; live.sentAt = now; post('/api/targets', JSON.parse(body)); }
    const res = await fetch('/api/state', { cache: 'no-store' });
    const s = await res.json();
    if (s.ready && live.on) { live.st = s; applyPose(s.q, s.joints); showLive(); }
  } catch { /* server went away: keep the last pose */ }
  live.busy = false;
}

// ---------- can both targets be grasped together? (asked from rl/live_server.py -> dual_ik.py) ----------
const fz = { info: null, res: null, sent: '', pending: false, changedAt: 0, last: '' };
const fzLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineDashedMaterial({ color: 0x8b93a1, dashSize: 0.04, gapSize: 0.025 }));
scene.add(fzLine);
function showFeasible() {
  if (!fz.info) return;
  const r = fz.res;
  let key = 'fz_off', col = '#8b93a1';
  if (live.ok) {
    if (!r || fz.pending) { key = 'fz_wait'; }
    else if (r.reachable && r.collision_free) { key = 'fz_ok'; col = '#4dd964'; }
    else if (r.reachable) { key = 'fz_col'; col = '#f0b343'; }
    else { key = 'fz_no'; col = '#ff5b5b'; }
  }
  fz.info.textContent = r ? tr(key, r.solved, r.attempts, r.target_distance_m.toFixed(2), r.best_pos_err_mm, r.best_rot_err_deg) : tr(key);
  fz.info.style.borderColor = col; fz.info.style.color = col === '#8b93a1' ? '' : col;
  fzLine.material.color.set(col);
}
rerender.push(showFeasible);
function feasibleTick(now) {
  const a = targets[0].group.position, b = targets[1].group.position;
  fzLine.geometry.setFromPoints([a, b]); fzLine.computeLineDistances();
  if (!live.ok) return;
  if (lock[0] || lock[1]) { fz.res = null; fz.sent = ''; fz.info.textContent = tr('lock_hint'); fz.info.style.borderColor = ''; fz.info.style.color = ''; return; }
  const body = JSON.stringify(targetPayload());
  if (body !== fz.last) { fz.last = body; fz.changedAt = now; }
  if (fz.pending || body === fz.sent || now - fz.changedAt < 250) return;     // wait until the drag pauses
  fz.sent = body; fz.pending = true; showFeasible();
  post('/api/feasible', JSON.parse(body)).then(r => r && r.ok ? r.json() : null).then(r => { fz.pending = false; if (r) fz.res = r; showFeasible(); })
    .catch(() => { fz.pending = false; });
}

// ---------- main loop ----------
const hud = document.getElementById('hud');
const P = new THREE.Vector3(), Q = new THREE.Quaternion(), S = new THREE.Vector3();
const v3 = a => a.map(v => v.toFixed(3).padStart(7)).join(' ');
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const k = c => keys.has(c) ? 1 : 0;
  const vx = (k('w') - k('s')) * 0.6, vy = (k('a') - k('d')) * 0.6, wz = (k('q') - k('e')) * 1.5;
  const driving = !!(vx || vy || wz);
  if (driving) setWheelCmd(twistToWheels(vx, vy, wz));
  else if (wasDriving) setWheelCmd(wheels.map(() => 0));
  wasDriving = driving;
  // a grasp point cannot be below the floor: keep targets at least 6 cm up (the lowest height used in training)
  for (const T of targets) if (T.group.position.z < 0.06) T.group.position.z = 0.06;
  applyLocks();
  feasibleTick(performance.now());
  if (live.on) liveTick(performance.now());
  else if (play.k >= 0) {
    const R = play.data[play.k];
    if (play.on) {
      play.t += dt;
      if (play.t > R.frames.length * R.dt + 1.5) play.t = 0;      // loop after a short hold
      const fi = Math.min(Math.floor(play.t / R.dt), R.frames.length - 1);
      applyFrame(fi);
      play.ui.scrub.value = fi;
    }
  } else driveStep(dt);
  // arrow keys slide the selected target along the floor, relative to the current view:
  // up = away from the camera, down = towards it, left / right = sideways
  if (selected) {
    const fwd = k('arrowup') - k('arrowdown'), side = k('arrowright') - k('arrowleft'), up = k('pageup') - k('pagedown');
    if (fwd || side || up) {
      const sp = (keys.has('shift') ? 0.9 : 0.3) * dt;
      const f = new THREE.Vector3(); camera.getWorldDirection(f); f.z = 0;
      if (f.lengthSq() < 1e-6) f.set(1, 0, 0);
      f.normalize();
      const rgt = new THREE.Vector3(f.y, -f.x, 0);
      selected.group.position.addScaledVector(f, fwd * sp).addScaledVector(rgt, side * sp);
      selected.group.position.z += up * sp;
    }
  }
  const lift = joints.joint5;
  if (lift && (k('r') || k('f'))) setJoint('joint5', lift.value + (k('r') - k('f')) * 0.15 * dt);
  if (anim) {
    animT += dt;
    movable().forEach((J, i) => {
      if (J.mate && J.name > J.mate) return;
      const mid = (J.lower + J.upper) / 2, amp = (J.upper - J.lower) / 2;
      const span = J.type === 'prismatic' ? 1 : 0.35;      // keep arm sweeps moderate
      const blend = Math.min(animT / 1.5, 1);              // ease in from the current pose
      const target = (J.type === 'prismatic' ? mid : 0) + amp * span * Math.sin(animT * (0.5 + 0.07 * i) + i);
      const v = animFrom[J.name] + (target - animFrom[J.name]) * blend;
      setJoint(J.name, v); if (J.mate) setJoint(J.mate, v);
    });
  }
  controls.update();
  sun.target.position.set(base.x, base.y, 0.4);
  sun.position.copy(sun.target.position).add(SUN_OFFSET);
  renderer.render(scene, camera);
  let t = `base   x ${base.x.toFixed(3)}  y ${base.y.toFixed(3)}  yaw ${(base.yaw * 180 / Math.PI).toFixed(1)}°   v [${drive.v.map(v => v.toFixed(2).padStart(6)).join(' ')}]\nwheel  ω [${drive.w.map(v => v.toFixed(1).padStart(6)).join(' ')}] rad/s   τ [${drive.tau.map(v => v.toFixed(1).padStart(5)).join(' ')}] N·m\n`;
  if (lift) t += `lift   ${(lift.value * 1000).toFixed(0)} mm\n`;
  for (const f of eeFrames) {
    f.tcp.matrixWorld.decompose(P, Q, S);
    t += `${f.label}  p [${P.toArray().map(v => v.toFixed(3).padStart(7)).join(' ')}]  q(xyzw) [${Q.toArray().map(v => v.toFixed(3).padStart(6)).join(' ')}]\n`;
  }
  targets.forEach((T, i) => {
    const tp = T.group.position, tq = T.group.quaternion;
    t += `${T.label} p [${v3(tp.toArray())}]  q(xyzw) [${tq.toArray().map(v => v.toFixed(3).padStart(6)).join(' ')}]`;
    const f = eeFrames[i];
    if (f) {
      f.tcp.matrixWorld.decompose(P, Q, S);
      t += `  err ${(P.distanceTo(tp) * 1000).toFixed(0).padStart(4)} mm ${(Q.angleTo(tq) * 180 / Math.PI).toFixed(0).padStart(3)}°`;
    }
    t += '\n';
  });
  hud.textContent = t.trimEnd();
  requestAnimationFrame(tick);
}

// ---------- boot ----------
const statusEl = document.getElementById('status');
try {
  const rootLink = await loadURDF();
  // wheels: continuous joints attached to the root link
  for (const J of rootLink.childJoints.filter(j => j.type === 'continuous')) {
    const a = J.axis.clone().applyQuaternion(J.origin.quaternion);       // spin axis in base frame
    const I = J.child.inertia, m = J.child.mass;
    const r = J.child.wheelRadius ?? Math.sqrt(2 * (I[0] * J.axis.x ** 2 + I[1] * J.axis.y ** 2 + I[2] * J.axis.z ** 2) / m);
    const p = J.origin.position.clone(), t = new THREE.Vector3(0, 0, 1).cross(a).normalize();
    wheels.push({ J, p, r, t, Iw: m * r * r / 2, row: [t.x, t.y, p.x * t.y - p.y * t.x] });
  }
  groundZ = wheels.length ? Math.max(...wheels.map(w => w.r - w.p.z)) : 0;
  // gripper frames = links that carry the two fingers
  for (const L of Object.values(links)) {
    if (L.childJoints.filter(j => j.type === 'prismatic' && j.child.childJoints.length === 0).length === 2) {
      // Grasp point (TCP): 0.13 m ahead of the gripper link, between the finger pads. This is the frame the
      // policy drives onto the target, drawn in the same red/green/blue style so the two can be compared.
      const tcp = new THREE.Group();
      tcp.position.set(0.13, 0, 0);
      L.group.add(tcp);
      const axes = new THREE.Group();
      [0xff4d4d, 0x4dd964, 0x4d8dff].forEach((c, i) => {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.11, 10), new THREE.MeshBasicMaterial({ color: c }));
        const d = new THREE.Vector3().setComponent(i, 1);
        m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
        m.position.copy(d).multiplyScalar(0.055);
        axes.add(m);
      });
      tcp.add(axes);
      eeFrames.push({ link: L, tcp, axes, label: L.name.startsWith('left') ? 'L grip' : L.name.startsWith('right') ? 'R grip' : L.name });
    }
  }
  buildUI();
  resetAll();
  captureRest();
  await buildPlaybackUI();
  await buildLiveUI();
  applyQuality();
  resetAll();
  const nJ = Object.values(joints).filter(j => j.type !== 'fixed').length;
  const sArgs = [meshOk, meshTotal, Object.keys(links).length, nJ, (wheels[0]?.r * 1000 || 0).toFixed(0), PKG];
  setStatus(meshOk === meshTotal ? 'st_ok' : 'st_missing', sArgs, meshOk !== meshTotal);
  window.__viewer = { selectJoint, drive, setWheelCmd, twistToWheels, massProps, targets, selectTarget, gizmo, joints, links, base, setJoint, setBase, wheels };
  if (location.hash === '#demo') { document.getElementById('bRandom').click(); setBase(0.5, 0.3, 0.6); document.getElementById('cAxes').click(); selectJoint('left_joint13', true); targets[1].group.position.set(0.9, -0.2, 0.5); targets[1].group.rotation.set(0.6, 0.4, 1.0); }
  if (location.hash.startsWith('#play') && play.data) { loadRollout(+location.hash.slice(5) || 0); play.t = +(location.hash.split('@')[1] ?? 0); }
  if (location.hash.includes('lockL')) setLock(0, true);
  if (location.hash.startsWith('#live') && live.ok) live.ui.start.click();
  if (location.hash.startsWith('#drive')) setWheelCmd(twistToWheels(...location.hash.slice(7).split(',').map(Number)));
  tick();
} catch (err) {
  setStatus('st_fail', [String(err)], true);
  console.error(err);
}
</script>
</body>
